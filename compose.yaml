services:
  app:
    build: .
    restart: unless-stopped
    env_file: /etc/agro/app.env
    environment:
      AGRO_COOKIE_SECURE: "true"
      HF_HOME: /app/data/hf-cache
    volumes:
      - /opt/agro-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: /etc/agro/domain.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  caddy_data:
  caddy_config:
