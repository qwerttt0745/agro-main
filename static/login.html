<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вхід · Агропомічник</title><style>
*{box-sizing:border-box}body{margin:0;background:#121510;color:#e9ede6;font:18px/1.5 system-ui;min-height:100dvh;display:grid;place-items:center;padding:24px}main{width:100%;max-width:380px}h1{font:32px Georgia}label{display:block;margin-top:20px}input,button{font:inherit;width:100%;padding:14px;border-radius:12px;border:1px solid #46523c}input{background:#1b2118;color:inherit;margin-top:6px}button{background:#acd09a;color:#142012;margin-top:24px;cursor:pointer}#error{color:#ffb5a1}small{color:#acb5a4}</style><main><h1>Агрономічний помічник</h1><p>Увійдіть до господарства</p><form id="login"><label>Логін<input name="username" autocomplete="username" autocapitalize="none" required maxlength="100"></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button>Увійти</button><p id="error" role="alert"></p></form><small>Вхід зберігається на цьому пристрої до 14 днів.</small></main><script>
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;document.getElementById('error').textContent='';try{const response=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json','X-Agro-Request':'1'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:'Перевірте введені дані.');location.replace('/');}catch(error){document.getElementById('error').textContent=error.message;}finally{button.disabled=false;}};
</script></html>
